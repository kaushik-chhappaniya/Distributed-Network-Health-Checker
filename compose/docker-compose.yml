include: 
  - docker-network-compose.yaml

services:
  # Database service
  db:
    image: postgres:16-alpine
    container_name: health-checker-db
    restart: always
    environment: 
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - health-net
  
  # Go Application
  api:
    build:
      context: ..
      dockerfile: compose/Dockerfile
    container_name: health-checker-api
    command: ["sleep", "infinity"]
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: admin
      DB_PASSWORD: admin
      DB_NAME: mydatabase
    volumes:
      - ../logs:/app/logs
      - ../OUTPUT:/app/output
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - health-net
    depends_on:
      - db

networks:
  health-net:
    name: health-net
    driver: bridge

volumes:
  pgdata: